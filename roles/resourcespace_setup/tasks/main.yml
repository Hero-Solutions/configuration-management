---
- name: Make sure the tmp directory exists
  file:
    path: "{{ cron_dir }}/tmp/"
    state: directory
    recurse: true
    owner: "{{ php.user }}"
    group: "{{ php.group }}"

- name: Make sure the ImageMagick tmp directory exists
  file:
    path: "{{ resourcespace.imagemagick.temporary_path }}"
    state: directory
    recurse: true
    owner: "{{ php.user }}"
    group: "{{ php.group }}"
  when: resourcespace.imagemagick.temporary_path != '/tmp' and resourcespace.imagemagick.temporary_path != '/tmp/'

- name: Set base_url without https
  set_fact:
    base_url_http: "{{ resourcespace.base_url | replace('https://', 'http://') }}"

- name: Set ResourceSpace setup URLs
  set_fact:
    resourcespace_setup_http_url: "{{ base_url_http }}/pages/setup.php"
    resourcespace_setup_https_url: "{{ resourcespace.base_url }}/pages/setup.php"

- name: Wait until ResourceSpace hostname listens on HTTP
  wait_for:
    host: "{{ resourcespace.nginx.server_name }}"
    port: 80
    state: started
    timeout: 30

- name: Check whether ResourceSpace responds on configured base URL
  uri:
    url: "{{ resourcespace_setup_https_url }}"
    method: GET
    timeout: 5
    follow_redirects: none
    validate_certs: no
  register: resourcespace_base_url_probe
  changed_when: false
  failed_when: false

- name: Execute cURL call to setup.php
  uri:
    url: "{{ resourcespace_setup_http_url }}"
    method: POST
    timeout: 300
    follow_redirects: none
    return_content: true
    body_format: form-urlencoded
    body:
      - [ defaultlanguage, en ]
      - [ mysql_server, "{{ resourcespace.mysql.hostname }}" ]
      - [ mysql_username, "{{ resourcespace.mysql.username }}" ]
      - [ mysql_password, "{{ resourcespace.mysql.password }}" ]
      - [ read_only_db_username, "{{ resourcespace.mysql.ro_username }}" ]
      - [ read_only_db_password, "{{ resourcespace.mysql.ro_password }}" ]
      - [ mysql_db, "{{ resourcespace.mysql.database }}" ]
      - [ mysql_bin_path, /usr/bin ]
      - [ applicationname, ResourceSpace ]
      - [ baseurl, "{{ base_url_http }}" ]
      - [ admin_fullname, "{{ resourcespace.admin.full_name }}" ]
      - [ admin_email, "{{ resourcespace.admin.email }}" ]
      - [ admin_username, "{{ resourcespace.admin.username }}" ]
      - [ admin_password, "{{ resourcespace.admin.password }}" ]
      - [ email_from, "{{ resourcespace.admin.from_email }}" ]
      - [ imagemagick_path, /usr/bin ]
      - [ ghostscript_path, /usr/bin ]
      - [ ffmpeg_path, /usr/bin ]
      - [ exiftool_path, /usr/bin ]
      - [ antiword_path, /usr/bin ]
      - [ pdftotext_path, /usr/bin ]
      - [ smtp_secure, '' ]
      - [ smtp_host, '' ]
      - [ smtp_port, '' ]
      - [ smtp_auth, on ]
      - [ smtp_username, '' ]
      - [ smtp_password, '' ]
      - [ google_vision_key, '' ]
      - [ submit, Begin installation ]
  register: setup_status_code
  no_log: true
  failed_when: setup_status_code.status != 200 and setup_status_code.status != 301 and setup_status_code.status != 302

- name: Fail when ResourceSpace setup redirects to HTTPS but HTTPS is unavailable
  fail:
    msg: "ResourceSpace setup redirected from HTTP, but the configured base URL is unavailable. Set resourcespace.nginx.redirect_to_https to false and use an http:// resourcespace.base_url until HTTPS is available."
  when:
    - setup_status_code.status == 301 or setup_status_code.status == 302
    - resourcespace_base_url_probe.status | default(-1) == -1

- name: Execute cURL call to setup.php
  uri:
    url: "{{ resourcespace_setup_https_url }}"
    method: POST
    timeout: 300
    follow_redirects: none
    validate_certs: no
    return_content: true
    body_format: form-urlencoded
    body:
      - [ defaultlanguage, en ]
      - [ mysql_server, "{{ resourcespace.mysql.hostname }}" ]
      - [ mysql_username, "{{ resourcespace.mysql.username }}" ]
      - [ mysql_password, "{{ resourcespace.mysql.password }}" ]
      - [ read_only_db_username, "{{ resourcespace.mysql.ro_username }}" ]
      - [ read_only_db_password, "{{ resourcespace.mysql.ro_password }}" ]
      - [ mysql_db, "{{ resourcespace.mysql.database }}" ]
      - [ mysql_bin_path, /usr/bin ]
      - [ applicationname, ResourceSpace ]
      - [ baseurl, "{{ resourcespace.base_url }}" ]
      - [ admin_fullname, "{{ resourcespace.admin.full_name }}" ]
      - [ admin_email, "{{ resourcespace.admin.email }}" ]
      - [ admin_username, "{{ resourcespace.admin.username }}" ]
      - [ admin_password, "{{ resourcespace.admin.password }}" ]
      - [ email_from, "{{ resourcespace.admin.from_email }}" ]
      - [ imagemagick_path, /usr/bin ]
      - [ ghostscript_path, /usr/bin ]
      - [ ffmpeg_path, /usr/bin ]
      - [ exiftool_path, /usr/bin ]
      - [ antiword_path, /usr/bin ]
      - [ pdftotext_path, /usr/bin ]
      - [ smtp_secure, '' ]
      - [ smtp_host, '' ]
      - [ smtp_port, '' ]
      - [ smtp_auth, on ]
      - [ smtp_username, '' ]
      - [ smtp_password, '' ]
      - [ google_vision_key, '' ]
      - [ submit, Begin installation ]
  register: resourcespace_setup_https_result
  no_log: true
  when:
    - setup_status_code.status == 301 or setup_status_code.status == 302
    - resourcespace_base_url_probe.status | default(-1) != -1

- name: Select final ResourceSpace setup response
  set_fact:
    resourcespace_setup_response_content: >-
      {{
        resourcespace_setup_https_result.content | default('')
        if setup_status_code.status in [301, 302]
        else setup_status_code.content | default('')
      }}
  no_log: true

- name: Extract ResourceSpace setup validation messages
  set_fact:
    resourcespace_setup_messages: >-
      {{
        resourcespace_setup_response_content
        | regex_findall('(?is)<div[^>]*class="(?:erroritem|warnitem)"[^>]*>(.*?)</div>')
        | map('regex_replace', '(?is)<[^>]+>', ' ')
        | map('regex_replace', '\\s+', ' ')
        | list
      }}

- name: Check whether ResourceSpace created config.php
  stat:
    path: "{{ resourcespace.repo_dir }}/include/config.php"
  register: resourcespace_config_file

- name: Stop when ResourceSpace setup validation failed
  fail:
    msg: >-
      ResourceSpace setup returned HTTP 200 but did not create config.php.
      Validation messages: {{ resourcespace_setup_messages | join(' | ') if resourcespace_setup_messages | length > 0 else 'none found in response; check the PHP-FPM and nginx error logs' }}
  when: not resourcespace_config_file.stat.exists

- name: Verify that ResourceSpace created its database schema
  community.mysql.mysql_query:
    login_db: "{{ resourcespace.mysql.database }}"
    login_user: "{{ resourcespace.mysql.username }}"
    login_password: "{{ resourcespace.mysql.password }}"
    query: "SELECT COUNT(*) AS table_count FROM information_schema.tables WHERE table_schema = DATABASE() AND table_name = 'plugins'"
  register: resourcespace_schema_check
  changed_when: false
  no_log: true

- name: Stop when ResourceSpace database schema creation failed
  fail:
    msg: "ResourceSpace created config.php but did not create the database schema. Check the PHP-FPM and nginx error logs for the setup.php request."
  when: resourcespace_schema_check.query_result[0][0].table_count | int != 1

- name: Replace ResourceSpace base_url
  replace:
    path: "{{ resourcespace.repo_dir }}/include/config.php"
    regexp: "{{ base_url_http }}"
    replace: "{{ resourcespace.base_url }}"
  when:
    - setup_status_code.status == 200
    - resourcespace.base_url != base_url_http
    - resourcespace_base_url_probe.status | default(-1) != -1

- name: Create repo folder
  file:
    path: "{{ resourcespace.rs_ptif.repo_dir }}"
    state: directory
    recurse: true
    owner: "{{ application_user }}"
    group: "{{ application_user }}"

- name: Checkout rs_ptif repo
  git:
    repo: "{{ resourcespace.rs_ptif.repo_url }}"
    dest: "{{ resourcespace.rs_ptif.repo_dir }}/repo/"
    force: true
    version: "{{ resourcespace.rs_ptif.branch }}"
  become_user: "{{ application_user }}"

- name: Chown rs_ptif checkout
  file:
    path: "{{ resourcespace.rs_ptif.repo_dir }}/repo/"
    state: directory
    recurse: true
    owner: "{{ php.user }}"
    group: "{{ php.group }}"

- name: Link rs_ptif repo
  file:
    src: "{{ resourcespace.rs_ptif.repo_dir }}/repo/iiif_ptif/"
    dest: "{{ resourcespace.repo_dir }}/plugins/iiif_ptif"
    state: link
    owner: "{{ php.user }}"
    group: "{{ php.group }}"

- name: Activate rs_ptif plugin
  community.mysql.mysql_query:
    login_db: "{{ resourcespace.mysql.database }}"
    login_user: "{{ resourcespace.mysql.username }}"
    login_password: "{{ resourcespace.mysql.password }}"
    query: "INSERT INTO plugins(name, descrip, author, update_url, info_url, inst_version, config, config_json, config_url, enabled_groups, priority, disable_group_select, title, icon) VALUES('iiif_ptif', 'Allows files to be converted to Tiled Pyramidal TIFF (PTIF) on upload', 'Michiel Hebben', '', '', 1, NULL, NULL, '', NULL, 1, 0, '', '') ON DUPLICATE KEY UPDATE inst_version=VALUES(inst_version)"

- name: Check if rs_ptif_config.php is already appended to config.php
  shell: "fgrep -q '# RS_ptif configuration' {{ resourcespace.repo_dir }}/include/config.php"
  register: first_rs_run
  failed_when: first_rs_run.rc != 0 and first_rs_run.rc != 1

- name: Provide necessary ResourceSpace metadata fields
  mysql_db:
    name: "{{ resourcespace.mysql.database }}"
    login_user: "{{ resourcespace.mysql.username }}"
    login_password: "{{ resourcespace.mysql.password }}"
    state: import
    target: "{{ imagehub.repo_dir }}/repo/resourcespace_metadata.sql"
  when: first_rs_run.rc == 1

- name: Put the config.php template
  template:
    src: config.php
    dest: /tmp/rs_ptif_config.php
  when: first_rs_run.rc == 1

- name: Put the sRGB ICC profile file
  copy:
    src: sRGB2014.icc
    dest: "{{ resourcespace.rs_ptif.repo_dir }}"
    owner: "{{ php.user }}"
    group: "{{ php.group }}"

- name: Append rs_ptif_config.php to config.php if not already done so
  shell: "cat /tmp/rs_ptif_config.php >> {{ resourcespace.repo_dir }}/include/config.php"
  when: first_rs_run.rc == 1

- name: Grab the api_scramble_key from config.php
  shell: sed -n "/api_scramble_key/s/.*'\([^']\+\)'.*/1\1/p" {{ resourcespace.repo_dir }}/include/config.php
  register: rs_api_scramble_key

- name: Generate API key
  set_fact:
    imagehub_rs_api_key: "{{ rs_api_scramble_key.stdout | hash('sha256') }}"

- name: Copy imagehub.yaml for imagehub with new rs_api_key
  include_role:
    name: imagehub
    tasks_from: place_config.yml
  vars:
    rs_api_key: "{{ imagehub_rs_api_key }}"
