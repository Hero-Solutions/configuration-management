[General]
id_path = '_metadata.loi'

[Importer]
plugin = EIZ

[plugin_importer_EIZ]
endpoint = {{ anet_url }}
metadata_prefix = bxml
set = {{ set }}
handler = adlib

[Fixer]
plugin = Fix

[plugin_fixer_Fix]
file_name = '{{ fix_file_path }}'

[Exporter]
plugin = Arthub

[plugin_exporter_YAML]

[plugin_exporter_Arthub]
datahub_url = {{ datahub_url }}
datahub_format = LIDO
oauth_client_id = {{ oauth_client_id }}
oauth_client_secret = {{ oauth_secret }}
oauth_username = {{ consumer_username }}
oauth_password = {{ consumer_password }}
