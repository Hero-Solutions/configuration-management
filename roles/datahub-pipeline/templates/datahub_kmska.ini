[General]
id_path = 'ObjectNumber'

[Importer]
plugin = KMSKA

[plugin_importer_KMSKA]
db_host = {{ datahub_pipeline.mariadb.host }}
db_name = {{ datahub_pipeline.mariadb.name }}
db_user = {{ datahub_pipeline.mariadb.username }}
db_password = {{ datahub_pipeline.mariadb.password }}
generate_temp_tables = {{ generate_temp_tables | ternary(1, 0) }}

[Fixer]
plugin = Fix

[plugin_fixer_Fix]
file_name = '{{ fix_file_path }}'

[Exporter]
plugin = Arthub

[plugin_exporter_YAML]

[plugin_exporter_Arthub]
datahub_url = {{ datahub_url }}
datahub_format = LIDO
oauth_client_id = {{ oauth_client_id }}
oauth_client_secret = {{ oauth_secret }}
oauth_username = {{ oauth_username }}
oauth_password = {{ oauth_password }}
