---
- name: Ensure php-fpm pool directory exists
  file:
    path: "{{ php_fpm_pool_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Check if default www pool exists
  stat:
    path: "{{ php_fpm_pool_dir }}/www.conf"
  register: www_pool

- name: Disable default www pool if present
  command:
    cmd: mv {{ php_fpm_pool_dir }}/www.conf {{ php_fpm_pool_dir }}/www.conf.disabled
  when: www_pool.stat.exists
  notify: restart php-fpm

- name: Deploy php-fpm pool configuration
  template:
    src: pool.conf
    dest: "{{ php_fpm_pool_dir }}/{{ pool_name }}.conf"
    owner: root
    group: root
    mode: "0644"
  notify: restart php-fpm

- name: Ensure php-fpm service is enabled and running
  service:
    name: "{{ php_fpm_service }}"
    state: started
    enabled: true
