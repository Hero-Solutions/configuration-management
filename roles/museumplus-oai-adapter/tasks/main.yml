---
- name: Normalize MuseumPlus OAI adapter paths
  set_fact:
    museumplus_oai_adapter: "{{ museumplus_oai_adapter | combine({
      'repo_dir': museumplus_oai_adapter.repo_dir | regex_replace('\\/$', ''),
      'dir': museumplus_oai_adapter.dir | regex_replace('\\/$', '')
    }, recursive=true) }}"

- name: Assert MuseumPlus OAI adapter required configuration is present
  assert:
    that:
      - museumplus_oai_adapter.app_secret | default('') | length > 0
      - museumplus_oai_adapter.mysql.password | default('') | length > 0
      - museumplus_oai_adapter.museumplus.export_url | default('') | length > 0
      - museumplus_oai_adapter.museumplus.username | default('') | length > 0
      - museumplus_oai_adapter.museumplus.password | default('') | length > 0
      - museumplus_oai_adapter.museumplus.search_field_path | default('') | length > 0
      - museumplus_oai_adapter.museumplus.search_operand | default('') | length > 0
      - museumplus_oai_adapter.museumplus.timeout_seconds | default('') | string | length > 0
      - museumplus_oai_adapter.oai.identifier_prefix | default('') | length > 0
      - museumplus_oai_adapter.oai.default_set_spec | default('') | length > 0
    fail_msg: "MuseumPlus OAI adapter secrets/config must be provided through host_vars or Ansible Vault, not group_vars/all.yml defaults."
  no_log: true

- name: Validate MuseumPlus organisation filter
  assert:
    that:
      - museumplus_oai_adapter.museumplus.org_units | default([]) is sequence
      - museumplus_oai_adapter.museumplus.org_units | default([]) is not string
      - museumplus_oai_adapter.museumplus.org_units | default([]) is not mapping
    fail_msg: "museumplus.org_units must be a YAML list of organisation codes; [] disables this filter."

- name: Validate MuseumPlus organisation codes
  assert:
    that:
      - item is string
      - item is match('^org_[0-9]+_[A-Za-z0-9_-]+$')
    fail_msg: "Use the exact organisation codes supplied by MuseumPlus in museumplus.org_units."
  loop: "{{ museumplus_oai_adapter.museumplus.org_units | default([]) }}"

- name: Make sure MuseumPlus OAI adapter database is present
  mysql_db:
    name: "{{ museumplus_oai_adapter.mysql.database }}"
    login_user: root
    login_password: "{{ mariadb_root_password }}"

- name: Create MuseumPlus OAI adapter user in MariaDB
  mysql_user:
    name: "{{ museumplus_oai_adapter.mysql.username }}"
    password: "{{ museumplus_oai_adapter.mysql.password }}"
    login_user: root
    login_password: "{{ mariadb_root_password }}"
    priv: "{{ museumplus_oai_adapter.mysql.database }}.*:ALL,GRANT"
    check_implicit_admin: true

- name: Create MuseumPlus OAI adapter repo folder
  file:
    path: "{{ museumplus_oai_adapter.repo_dir }}"
    state: directory
    recurse: true
    owner: "{{ application_user }}"
    group: "{{ application_user }}"

- name: Checkout MuseumPlus OAI adapter repo
  git:
    repo: "{{ museumplus_oai_adapter.repo_url }}"
    dest: "{{ museumplus_oai_adapter.repo_dir }}/repo/"
    force: true
    version: "{{ museumplus_oai_adapter.branch }}"
  become_user: "{{ application_user }}"

- name: Check required MuseumPlus mapping and raw storage files
  stat:
    path: "{{ museumplus_oai_adapter.repo_dir }}/repo/{{ item }}"
    get_checksum: false
  loop:
    - config/museum-groups.php
    - config/axiell-reference.json
    - config/axiell-reference.jsonl
    - src/Import/RawResponseArchive.php
    - migrations/Version20261016120000.php
    - migrations/Version20261018120000.php
    - migrations/Version20261018140000.php
    - migrations/Version20261018160000.php
    - migrations/Version20261018170000.php
  register: museumplus_deployment_files

- name: Require a complete MuseumPlus adapter release
  assert:
    that:
      - item.stat.isreg | default(false)
    fail_msg: "Missing {{ item.item }}. Commit and push the adapter changes to the configured branch before deploying."
  loop: "{{ museumplus_deployment_files.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Create MuseumPlus OAI adapter shared folders
  file:
    path: "{{ museumplus_oai_adapter.repo_dir }}/shared/{{ item }}/"
    state: directory
    recurse: true
    mode: "0775"
    owner: "{{ application_user }}"
    group: "{{ php.group }}"
  with_items:
    - cache
    - log

- name: Delete existing MuseumPlus OAI adapter var folders
  file:
    path: "{{ museumplus_oai_adapter.repo_dir }}/repo/var/{{ item }}"
    state: absent
  with_items:
    - cache
    - log
  become_user: "{{ application_user }}"

- name: Ensure MuseumPlus OAI adapter var directory exists
  file:
    path: "{{ museumplus_oai_adapter.repo_dir }}/repo/var"
    state: directory
    owner: "{{ application_user }}"
    group: "{{ php.group }}"
    mode: "0775"

# Raw responses are durable source data. Never add this folder to the cache/log
# deletion loop. Stop a running import before deploying this one-time move.
- name: Inspect existing MuseumPlus raw archive
  stat:
    path: "{{ museumplus_oai_adapter.repo_dir }}/repo/var/museumplus-raw"
    follow: false
    get_checksum: false
  register: museumplus_raw_existing

- name: Inspect shared MuseumPlus raw archive
  stat:
    path: "{{ museumplus_oai_adapter.repo_dir }}/shared/museumplus-raw"
    follow: false
    get_checksum: false
  register: museumplus_raw_shared

- name: Check raw archives can be preserved without overwriting
  assert:
    that:
      - not museumplus_raw_existing.stat.exists or museumplus_raw_existing.stat.isdir | default(false) or museumplus_raw_existing.stat.islnk | default(false)
      - not museumplus_raw_shared.stat.exists or (museumplus_raw_shared.stat.isdir | default(false) and not museumplus_raw_shared.stat.islnk | default(false))
      - not (museumplus_raw_existing.stat.isdir | default(false) and not museumplus_raw_existing.stat.islnk | default(false) and museumplus_raw_shared.stat.exists)
      - not museumplus_raw_existing.stat.islnk | default(false) or museumplus_raw_existing.stat.lnk_source == museumplus_oai_adapter.repo_dir ~ '/shared/museumplus-raw'
    fail_msg: "Conflicting raw archive paths. Preserve both archives and resolve the paths manually; no raw files were deleted or merged."

- name: Preserve existing raw files in the shared archive
  command:
    argv:
      - mv
      - --no-clobber
      - --no-target-directory
      - --
      - "{{ museumplus_oai_adapter.repo_dir }}/repo/var/museumplus-raw"
      - "{{ museumplus_oai_adapter.repo_dir }}/shared/museumplus-raw"
  when:
    - museumplus_raw_existing.stat.isdir | default(false)
    - not museumplus_raw_existing.stat.islnk | default(false)
    - not museumplus_raw_shared.stat.exists
  become_user: "{{ application_user }}"

- name: Create persistent MuseumPlus raw archive
  file:
    path: "{{ museumplus_oai_adapter.repo_dir }}/shared/museumplus-raw"
    state: directory
    owner: "{{ application_user }}"
    group: "{{ application_user }}"
    mode: "0700"

- name: Link persistent MuseumPlus raw archive
  file:
    src: "{{ museumplus_oai_adapter.repo_dir }}/shared/museumplus-raw"
    dest: "{{ museumplus_oai_adapter.repo_dir }}/repo/var/museumplus-raw"
    state: link
    force: false
  become_user: "{{ application_user }}"

- name: Link MuseumPlus OAI adapter shared folders
  file:
    src: "{{ museumplus_oai_adapter.repo_dir }}/shared/{{ item }}"
    dest: "{{ museumplus_oai_adapter.repo_dir }}/repo/var/{{ item }}"
    state: link
    force: true
  with_items:
    - cache
    - log
  become_user: "{{ application_user }}"

- name: Link MuseumPlus OAI adapter repo
  file:
    src: "{{ museumplus_oai_adapter.repo_dir }}/repo/"
    dest: "{{ museumplus_oai_adapter.dir }}"
    state: link
    force: true

- name: Install MuseumPlus OAI adapter through composer
  command: composer install --no-dev --optimize-autoloader --no-interaction --no-scripts
  args:
    chdir: "{{ museumplus_oai_adapter.dir }}"
  become_user: "{{ application_user }}"

# Flex can append recipe defaults to .env during installation. Restore the
# complete deployment template before any Symfony scripts or migrations run.
- name: Copy .env for MuseumPlus OAI adapter
  template:
    src: museumplus.env.j2
    dest: "{{ museumplus_oai_adapter.repo_dir }}/repo/.env"
    owner: "{{ application_user }}"
    group: "{{ php.group }}"
    mode: "0640"
  no_log: true
  diff: false

- name: Run MuseumPlus OAI adapter Composer post-install scripts
  command: composer run-script post-install-cmd --no-dev --no-interaction
  args:
    chdir: "{{ museumplus_oai_adapter.dir }}"
  environment:
    APP_ENV: prod
    APP_DEBUG: "0"
  become_user: "{{ application_user }}"

- name: Run MuseumPlus OAI adapter migrations
  command: php bin/console doctrine:migrations:migrate --env=prod --no-interaction --allow-no-migration
  args:
    chdir: "{{ museumplus_oai_adapter.dir }}"
  environment:
    APP_ENV: prod
    APP_DEBUG: "0"
  become_user: "{{ application_user }}"

- name: Clear MuseumPlus OAI adapter prod cache
  command: php bin/console cache:clear --env=prod --no-debug
  args:
    chdir: "{{ museumplus_oai_adapter.dir }}"
  become_user: "{{ application_user }}"

- name: Chown MuseumPlus OAI adapter cache and log folders
  file:
    path: "{{ museumplus_oai_adapter.repo_dir }}/shared/{{ item }}/"
    state: directory
    recurse: true
    mode: "g+w"
    owner: "{{ application_user }}"
    group: "{{ php.group }}"
  with_items:
    - cache
    - log

- name: Inspect the previous shared import script
  stat:
    path: "{{ cron_dir }}/cron/import_data.sh"
    get_checksum: false
  register: museumplus_previous_cron_script

- name: Remove the previous MuseumPlus entry from the shared import script
  lineinfile:
    path: "{{ cron_dir }}/cron/import_data.sh"
    regexp: "^{{ item | regex_escape }}$"
    state: absent
  loop: "{{ ['php ' ~ museumplus_oai_adapter.dir ~ '/bin/console app:import-museumplus-records', museumplus_oai_adapter.import_cron_command | default('php ' ~ museumplus_oai_adapter.dir ~ '/bin/console app:import-museumplus-records')] | unique | list }}"
  when: museumplus_previous_cron_script.stat.isreg | default(false)

- name: Schedule MuseumPlus import independently of the shared pipeline
  cron:
    name: "Import MuseumPlus records"
    user: "{{ application_user }}"
    minute: "{{ museumplus_oai_adapter.import_cron_minute | default('0') }}"
    hour: "{{ museumplus_oai_adapter.import_cron_hour | default('8') }}"
    job: "cd {{ museumplus_oai_adapter.dir | quote }} && {{ museumplus_oai_adapter.import_cron_command | default('php bin/console app:import-museumplus-records --no-interaction') }} >> {{ (museumplus_oai_adapter.repo_dir ~ '/shared/log/import.log') | quote }} 2>&1"
    state: "{{ 'present' if museumplus_oai_adapter.import_cron_enabled | default(true) | bool else 'absent' }}"

- name: Set up MuseumPlus OAI adapter php-fpm pool
  include_role:
    name: php-fpm
    tasks_from: create_pool.yml
    apply:
      vars:
        pool_name: "{{ museumplus_oai_adapter.nginx.name }}"
        php_admin_values:
          memory_limit: "{{ museumplus_oai_adapter.php.memory_limit }}"

- name: Set up MuseumPlus OAI adapter nginx vhost
  include_role:
    name: nginx
    tasks_from: create_vhost.yml
    apply:
      vars:
        nginx_vhost:
          server_name: "{{ museumplus_oai_adapter.nginx.server_name }}"
          name: "{{ museumplus_oai_adapter.nginx.name }}"
          configfile: "{{ museumplus_oai_adapter.nginx.configfile }}"
          type: php
          document_root: "{{ museumplus_oai_adapter.nginx.document_root }}"
          index: "{{ museumplus_oai_adapter.nginx.index }}"
          php_socket_name: "{{ museumplus_oai_adapter.nginx.name }}"
          ssl: "{{ museumplus_oai_adapter.nginx.ssl }}"
          redirect_to_https: "{{ museumplus_oai_adapter.nginx.redirect_to_https }}"
          auth_basic: "{{ museumplus_oai_adapter.nginx.auth_basic | default('') }}"
          auth_basic_whitelist: "{{ museumplus_oai_adapter.nginx.auth_basic_whitelist | default([]) }}"
          other_settings: "{{ museumplus_oai_adapter.nginx.other_settings | default([]) }}"
