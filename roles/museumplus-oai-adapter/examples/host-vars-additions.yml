# Merge into the existing museumplus_oai_adapter block; keep its other settings.
# Set these IDs in the host-specific configuration; the role has no default IDs.
# Remove search_field_path, search_operand and org_units from the existing block.
museumplus_oai_adapter:
  import_cron_enabled: true
  import_cron_hour: "8"
  import_cron_minute: "0"
  museumplus:
    # Fill in the publication IDs in this host's private configuration.
    webpublication_ids: []
