---
- name: Install ResourceSpace dependencies
  apt:
    name:
      - subversion
      - php{{ php.version }}-gd
      - php{{ php.version }}-imagick
      - php{{ php.version }}-mysql
      - exiftool
      - imagemagick
      - python3-lxml
      - inkscape
      - ghostscript
      - antiword
      - postfix
      - libimage-exiftool-perl
      - ffmpeg
      - poppler-utils
      - wget
      - libvips
      - libvips-tools

- name: Check for the ImageMagick 7 policy
  stat:
    path: /etc/ImageMagick-7/policy.xml
    get_checksum: false
    get_mime: false
  register: resourcespace_imagemagick_7_policy

- name: Select the ImageMagick policy file
  set_fact:
    resourcespace_imagemagick_policy_path: "{{ '/etc/ImageMagick-7/policy.xml' if resourcespace_imagemagick_7_policy.stat.exists else '/etc/ImageMagick-6/policy.xml' }}"

- name: Set ImageMagick cache limits without replacing other policies
  community.general.xml:
    path: "{{ resourcespace_imagemagick_policy_path }}"
    xpath: "/policymap/policy[@domain='resource' and @name='{{ item.name }}']"
    attribute: value
    value: "{{ item.value }}"
  loop:
    - name: temporary-path
      value: "{{ resourcespace.imagemagick.temporary_path }}"
    - name: memory
      value: "{{ resourcespace.imagemagick.memory }}"
    - name: disk
      value: "{{ resourcespace.imagemagick.disk | default('8GiB') }}"
  loop_control:
    label: "{{ item.name }}"

- name: Keep ImageMagick network delegates and indirect file reads disabled
  community.general.xml:
    path: "{{ resourcespace_imagemagick_policy_path }}"
    xpath: "/policymap/policy[@domain='{{ item.domain }}' and @pattern='{{ item.pattern }}']"
    attribute: rights
    value: none
  loop:
    - { domain: delegate, pattern: URL }
    - { domain: delegate, pattern: HTTPS }
    - { domain: delegate, pattern: HTTP }
    - { domain: path, pattern: '@*' }

- name: Clone ResourceSpace
  subversion:
    repo: "{{ resourcespace.repo_url }}/{{ resourcespace.version }}"
    dest: "{{ resourcespace.repo_dir }}"
    update: no

- name: Create the iiif_ptif folder inside the filestore
  file:
    path: "{{ resourcespace.repo_dir }}/filestore/iiif_ptif/"
    state: directory
    recurse: true
    owner: "{{ php.user }}"
    group: "{{ php.group }}"

- name: Chown all files and folders to the www user
  file:
    path: "{{ resourcespace.repo_dir }}"
    state: directory
    recurse: true
    owner: "{{ php.user }}"
    group: "{{ php.group }}"

- name: Make sure ResourceSpace database is present
  mysql_db:
    name: "{{ resourcespace.mysql.database }}"
    login_user: root
    login_password: "{{ mariadb_root_password }}"

- name: Create ResourceSpace user in MariaDB
  mysql_user:
    name: "{{ resourcespace.mysql.username }}"
    password: "{{ resourcespace.mysql.password }}"
    login_user: root
    login_password: "{{ mariadb_root_password }}"
    priv: "{{ resourcespace.mysql.database }}.*:ALL,GRANT"
    check_implicit_admin: true

- name: Create ResourceSpace read-only user in MariaDB
  mysql_user:
    name: "{{ resourcespace.mysql.ro_username }}"
    password: "{{ resourcespace.mysql.ro_password }}"
    login_user: root
    login_password: "{{ mariadb_root_password }}"
    priv: "{{ resourcespace.mysql.database }}.*:SELECT"
    check_implicit_admin: true

- name: Include resourcespace php-fpm pool
  include_role:
    name: php-fpm
    tasks_from: create_pool.yml
    apply:
      vars:
        pool_name: "{{ resourcespace.nginx.name }}"
        php_admin_values:
          memory_limit: "{{ resourcespace.php.memory_limit }}" 
          post_max_size: "{{ resourcespace.php.post_max_size }}"
          upload_max_filesize: "{{ resourcespace.php.upload_max_filesize }}"

- name: Set fact to inform imagehub that ResourceSpace is present
  set_fact:
    is_resourcespace: true
